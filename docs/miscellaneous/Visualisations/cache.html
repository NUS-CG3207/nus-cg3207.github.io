<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cache Memory Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e27;--panel:#0d1130;--panel2:#111540;--line:#2a2e57;--line2:#3a3e67;
  --txt:#e0e0e0;--dim:#8888aa;--blue:#60a5fa;--amber:#fbbf24;--green:#34d399;--red:#f87171;--purple:#a78bfa;--pink:#f472b6;
  --mono:'Fira Code','Cascadia Code','JetBrains Mono',ui-monospace,monospace;
  --f-tag:#a78bfa;--f-idx:#60a5fa;--f-word:#fbbf24;--f-byte:#6b7280;
  --t-hit:#34d399;--t-comp:#60a5fa;--t-cap:#fbbf24;--t-conf:#f87171;--t-coh:#f472b6;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
.header{
  text-align:center;padding:10px 16px 5px;
  background:linear-gradient(135deg,#0a0e27,#1a1e47);
  border-bottom:2px solid var(--line);flex-shrink:0;
}
.header h1{
  font-size:clamp(1rem,3.2vw,1.5rem);
  background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px;
}
.header p{color:var(--dim);font-size:clamp(.65rem,1.8vw,.8rem)}

.setup{
  display:flex;justify-content:center;align-items:center;gap:8px 14px;flex-wrap:wrap;
  padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
.grp{display:flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.mode-btn{
  padding:5px 13px;border:2px solid var(--line2);border-radius:30px;background:transparent;color:#aaa;
  font-size:clamp(.68rem,1.8vw,.82rem);cursor:pointer;transition:all .3s;font-weight:600;
}
.mode-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.08)}
.mode-btn.active{border-color:var(--green);background:rgba(52,211,153,.13);color:var(--green);box-shadow:0 0 15px rgba(52,211,153,.1)}
.setup label{font-size:.75rem;color:var(--dim)}
.setup input,.setup select,.card select{
  background:#11112b;color:var(--amber);border:1px solid var(--line2);border-radius:6px;
  padding:4px 6px;font:600 .85rem var(--mono);width:56px;
}
.setup select,.card select{width:auto;color:var(--txt);font-family:inherit;font-weight:500;font-size:.78rem}
.setup input:focus,.setup select:focus{outline:none;border-color:var(--blue)}
.hidden{display:none!important}

.status{flex-shrink:0;padding:6px 12px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
#state-display{
  text-align:center;font-weight:bold;background:rgba(96,165,250,.08);padding:5px 16px;
  border-radius:20px;border:1px solid var(--blue);color:#93c5fd;font-size:.85rem;
}
#state-display.err{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
#geo-sum{font:.68rem var(--mono);color:var(--dim);text-align:center}
#caption{
  max-width:960px;text-align:center;font-size:.82rem;line-height:1.35;color:#c9cbe6;
  min-height:2.7em;display:flex;align-items:center;justify-content:center;
}
#caption b{color:var(--amber);font-weight:600}

.tabs{display:none}
.main{
  display:grid;flex:1;min-height:0;max-width:1600px;width:100%;margin:0 auto;padding:8px 10px;gap:10px;
  grid-template-columns:minmax(320px,400px) minmax(0,1fr) minmax(320px,420px);
}
.mid{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.mid > .col{flex:1 1 auto}
.mid > #c-cache{flex:0 1 auto;max-height:62%}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.col::-webkit-scrollbar{width:5px}.col::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:10px}
.card h3{font-size:.73rem;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.mini{
  padding:2px 9px;border:1px solid var(--line2);border-radius:20px;background:transparent;color:#aaa;
  font-size:.66rem;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;
}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.mini.active{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.1)}
.note{font-size:.7rem;color:var(--dim);line-height:1.4}
.note b{color:#c9cbe6;font-weight:600}

/* address fields */
.addr-bits{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-bottom:6px}
.ab{
  width:17px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font:700 .74rem var(--mono);color:#0a0e27;position:relative;
}
.ab.gap{margin-left:5px}
.ab.tag{background:var(--f-tag)}.ab.idx{background:var(--f-idx)}.ab.word{background:var(--f-word)}.ab.byte{background:var(--f-byte);color:#e5e7eb}
.fields{display:grid;grid-template-columns:auto auto 1fr;gap:3px 10px;font:.74rem var(--mono);align-items:center}
.fields .fn{font-weight:700}
.fields .fb{color:var(--dim);font-size:.66rem}
.fields .fv{color:#e5e7ff}
.fn.tag{color:var(--f-tag)}.fn.idx{color:var(--f-idx)}.fn.word{color:var(--f-word)}.fn.byte{color:#9ca3af}
.addr-line{text-align:center;font:700 .95rem var(--mono);color:var(--amber);margin-bottom:5px}
.addr-line small{color:var(--dim);font-weight:400;font-size:.7rem}

/* lookup */
.lk{width:100%;border-collapse:collapse;font:.72rem var(--mono)}
.lk th{color:var(--dim);font-weight:500;font-size:.63rem;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
.lk td{padding:3px 4px;border-bottom:1px solid rgba(42,46,87,.5)}
.lk tr.match td{background:rgba(52,211,153,.12)}
.lk tr.vic td{background:rgba(248,113,113,.1)}
.ok{color:var(--green);font-weight:700}.no{color:#666}
.verdict{margin-top:7px;padding:6px 8px;border-radius:6px;font:700 .8rem var(--mono);text-align:center;border:1px solid var(--line)}
.verdict.hit{color:var(--t-hit);border-color:var(--t-hit);background:rgba(52,211,153,.08)}
.verdict.miss{color:var(--t-conf);border-color:var(--t-conf);background:rgba(248,113,113,.08)}
.verdict.dma{color:var(--t-coh);border-color:var(--t-coh);background:rgba(244,114,182,.08)}
.mm-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mmb{font:.68rem var(--mono);padding:2px 6px;border:1px solid var(--line2);border-radius:4px;color:#c9cbe6;background:#11112b}
.mmb.cur{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.12)}
.mmb.in{border-color:var(--green)}
.mmb.dots{border:none;background:none;color:var(--dim)}

/* cache grid */
.cg{width:100%;border-collapse:collapse;font:.72rem var(--mono)}
.cg th{color:var(--dim);font-weight:500;font-size:.63rem;text-align:left;padding:2px 5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.cg td{padding:2px 5px;border-bottom:1px solid rgba(42,46,87,.45);white-space:nowrap}
.cg td.setc{color:var(--f-idx);font-weight:700;border-right:1px solid var(--line);vertical-align:top}
.cg tr.setstart td{border-top:1px solid var(--line2)}
.cg tr.cur-set td{background:rgba(96,165,250,.06)}
.cg tr.touch td{background:rgba(52,211,153,.16)}
.cg tr.touch.fill td{background:rgba(251,191,36,.16)}
.cg tr.touch.inval td{background:rgba(244,114,182,.16)}
.cg .inv{color:#555}
.cg .stale{color:#777;text-decoration:line-through}
.cg .dirty{color:var(--red);font-weight:700}
.cg .tagc{color:var(--f-tag)}
.cg .blk{color:#e5e7ff}
.cg .age{color:var(--dim)}
.cg tr.skip td{color:var(--dim);font-style:italic;text-align:center;font-family:'Segoe UI',sans-serif;font-size:.66rem}

/* replacement comparison */
.cmp-row{margin-bottom:8px}
.cmp-h{font:700 .72rem var(--mono);color:#c9cbe6;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.cmp-h .mc{color:var(--red)}
.cmp-h.sel{color:var(--green)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.cc{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.cc.cur{border-color:var(--blue);background:rgba(96,165,250,.1)}
.cc.fut{opacity:.35}
.cc .sq{font:700 .74rem var(--mono);color:var(--blue)}
.cc .sn{font:.55rem var(--mono);color:var(--dim);height:.7rem}
.cc .bx{width:24px;height:18px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:.66rem var(--mono);color:#ddd;background:#11112b}
.cc .bx.new{border-color:var(--amber);color:var(--amber)}
.cc .bx.hit{border-color:var(--green);color:var(--green)}
.cc .mf{font:700 .7rem var(--mono);color:var(--red);height:.9rem}

/* trace */
textarea#trace-in{
  width:100%;min-height:72px;resize:vertical;background:#11112b;color:#e5e7ff;border:1px solid var(--line2);border-radius:6px;
  padding:5px 7px;font:.74rem/1.35 var(--mono);
}
textarea#trace-in:focus{outline:none;border-color:var(--blue)}
.tr-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.tr-ctl label{font-size:.7rem;color:var(--dim)}
#trace-err{font:.68rem var(--mono);color:var(--red);margin-top:4px}
.btn{padding:4px 12px;border:2px solid var(--blue);border-radius:20px;background:rgba(96,165,250,.1);color:var(--blue);font-size:.74rem;font-weight:700;cursor:pointer}
.btn:hover{background:rgba(96,165,250,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;margin-bottom:6px}
.st{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.st .k{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.st .v{font:700 .85rem var(--mono)}
.tt{width:100%;border-collapse:collapse;font:.7rem var(--mono)}
.tt th{color:var(--dim);font-weight:500;font-size:.6rem;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.tt td{padding:2px 4px;border-bottom:1px solid rgba(42,46,87,.45);white-space:nowrap}
.tt tr{cursor:pointer}
.tt tr:hover td{background:rgba(96,165,250,.06)}
.tt tr.cur td{background:rgba(96,165,250,.18)}
.tt tr.fut td{opacity:.45}
.tt .op-W{color:var(--amber)}.tt .op-D{color:var(--t-coh)}
.ty{font-weight:700}
.ty.hit{color:var(--t-hit)}.ty.compulsory{color:var(--t-comp)}.ty.capacity{color:var(--t-cap)}.ty.conflict{color:var(--t-conf)}.ty.coherence,.ty.dma{color:var(--t-coh)}
.ua{color:var(--red);font-size:.6rem;margin-left:3px}
.tr-wrap{max-height:none}

/* controls */
.controls{
  flex-shrink:0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px;
  padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);
}
.ctrl-btn{
  width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);background:rgba(255,255,255,.03);color:#ccc;
  font-size:1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.ctrl-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.1);transform:scale(1.05)}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
.ctrl-btn.primary{width:48px;height:48px;border-color:var(--blue);color:var(--blue);font-size:1.2rem}
.ctrl-btn.on{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.12)}
.btns{display:flex;gap:8px;align-items:center}
.scrub{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:460px;min-width:200px}
#slider{flex:1;accent-color:var(--blue)}
.step-indicator{font-size:.76rem;color:var(--dim);min-width:60px;text-align:center;font-weight:600;white-space:nowrap}
.controls select{background:#11112b;color:var(--txt);border:1px solid var(--line2);border-radius:6px;padding:4px;font-size:.75rem}
.kbd-hint{font-size:.64rem;color:#555;width:100%;text-align:center;line-height:1.4}
.kbd{display:inline-block;padding:0 4px;background:#1a1e47;border:1px solid var(--line2);border-radius:3px;font:.64rem var(--mono);color:#888}

@media(max-width:1180px){
  .tabs{display:flex;gap:6px;justify-content:center;padding:4px 8px;flex-shrink:0}
  .tab{flex:1;max-width:140px;padding:5px 6px;border:2px solid var(--line2);border-radius:30px;background:transparent;color:#aaa;font-size:.72rem;font-weight:600;cursor:pointer}
  .tab.active{border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.1)}
  .main{display:block;overflow-y:auto;padding:6px 8px}
  .mid{display:block}
  .col{display:none;overflow:visible}
  .col.show{display:flex}
  .mid > #c-cmp{max-height:none}
  .kbd-hint{display:none}
}
@media(max-width:600px){
  .header p{display:none}
  .header{padding:6px 10px 3px}
  .setup{gap:6px 10px;padding:5px 8px}
  .controls{gap:6px 8px;padding:6px 8px}
  .ctrl-btn{width:36px;height:36px;font-size:.95rem}
  .ctrl-btn.primary{width:42px;height:42px}
  #caption{font-size:.76rem;min-height:2.4em}
  .ab{width:15px;height:22px;font-size:.68rem}
}
</style>
</head>
<body>
<div class="header">
  <h1>🗃 Cache Memory Simulator</h1>
  <p>Mapping, replacement, write policies and the types of misses</p>
</div>

<div class="setup">
  <div class="grp">
    <button class="mode-btn active" id="m-byte" title="Byte addresses: 4 bytes per word, 2 byte-offset bits">Byte addr</button>
    <button class="mode-btn" id="m-word" title="Word addresses: no byte-offset bits">Word addr</button>
  </div>
  <div class="grp"><label for="in-ab">Address bits</label><input id="in-ab" type="number" min="4" max="32" inputmode="numeric"></div>
  <div class="grp"><label for="in-wpb">Words/block</label><select id="in-wpb"></select></div>
  <div class="grp"><label for="in-nb">Cache blocks</label><select id="in-nb"></select></div>
  <div class="grp"><label for="in-ways">Mapping</label><select id="in-ways"></select></div>
  <div class="grp" id="g-pol"><label for="in-pol">Replace</label><select id="in-pol"><option value="LRU">LRU</option><option value="FIFO">FIFO</option><option value="OPT">Optimal</option></select></div>
  <div class="grp"><label for="in-wr">Writes</label><select id="in-wr"><option value="WB">Write-back</option><option value="WT">Write-through</option></select></div>
  <div class="grp"><select id="preset" title="Examples"></select></div>
</div>

<div class="status">
  <div id="state-display"></div>
  <div id="geo-sum"></div>
  <div id="caption"></div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-col="c-look">Lookup</button>
  <button class="tab" data-col="c-cache">Cache</button>
  <button class="tab" data-col="c-cmp" id="tab-cmp">Replace</button>
  <button class="tab" data-col="c-tr">Trace</button>
</div>

<div class="main">
  <div class="col show" id="c-look">
    <div class="card">
      <h3>📍 Address</h3>
      <div id="addr"></div>
    </div>
    <div class="card">
      <h3 id="lk-h">🔎 Lookup</h3>
      <div id="lookup"></div>
    </div>
    <div class="card">
      <h3>🧱 Main memory blocks for this set</h3>
      <div id="mmap"></div>
    </div>
  </div>
  <div class="mid">
    <div class="col" id="c-cache">
      <div class="card">
        <h3>🗃 Cache <span class="sp"></span><button class="mini" id="b-used" title="Show only sets that hold a block, plus the current one">Used sets only</button></h3>
        <div id="cache"></div>
      </div>
    </div>
    <div class="col" id="c-cmp">
      <div class="card">
        <h3>♻ Replacement: same trace, three policies</h3>
        <div id="cmp"></div>
      </div>
    </div>
  </div>
  <div class="col" id="c-tr">
    <div class="card">
      <h3>✎ Trace</h3>
      <textarea id="trace-in" spellcheck="false" title="One access per item: R addr, W addr, or D addr (DMA write). Decimal, 0x hex or 0b binary. A bare number is a read. # starts a comment."></textarea>
      <div class="tr-ctl">
        <label for="in-unit">Numbers are</label>
        <select id="in-unit"><option value="addr">addresses</option><option value="block">block numbers</option></select>
        <button class="btn" id="b-run" title="Re-run the trace (Ctrl+Enter)">Run</button>
      </div>
      <div id="trace-err"></div>
    </div>
    <div class="card">
      <h3>📊 Results</h3>
      <div class="stats" id="stats"></div>
      <div class="tr-wrap"><table class="tt" id="trace"></table></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="btns">
    <button class="ctrl-btn" id="b-reset" title="Reset (R)">⟲</button>
    <button class="ctrl-btn" id="b-back" title="Previous access (←)">◀</button>
    <button class="ctrl-btn primary" id="b-step" title="Next access (→)">▶</button>
    <button class="ctrl-btn" id="b-end" title="Run to the end (End)">⏭</button>
    <button class="ctrl-btn" id="b-play" title="Auto-play (Space)">⏵</button>
    <select id="speed" title="Auto-play speed"><option value="1600">0.5×</option><option value="900" selected>1×</option><option value="400">2×</option><option value="150">5×</option></select>
  </div>
  <div class="scrub">
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Access">
    <span class="step-indicator" id="step-ind"></span>
  </div>
  <div class="kbd-hint"><span class="kbd">←</span><span class="kbd">→</span> access &nbsp; <span class="kbd">Space</span> auto-play &nbsp; <span class="kbd">R</span>/<span class="kbd">Home</span> start &nbsp; <span class="kbd">End</span> finish &nbsp; <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> run trace</div>
</div>

<script id="engine">
/* Cache engine. Pure: no DOM. A run precomputes the cache after every access
   so the UI can scrub both ways. Addresses are in bytes (4 per word) or words.
   Fields, high to low: tag | index | word | byte. Both write policies allocate
   on a write miss. Miss classes: coherence (block invalidated by DMA since it
   was last filled), compulsory (block never referenced), capacity (a fully
   associative LRU cache of the same size also misses), else conflict. */
const CS = (function () {
  const log2 = (n) => { let k = 0; while ((1 << k) < n) k++; return (1 << k) === n ? k : -1; };
  const P2 = (k) => Math.pow(2, k);

  function geometry(cfg) {
    const bpw = cfg.byteAddr ? 4 : 1, byteBits = cfg.byteAddr ? 2 : 0;
    const wordBits = log2(cfg.wordsPerBlock), blkBits = log2(cfg.numBlocks), wayBits = log2(cfg.ways);
    if (wordBits < 0 || blkBits < 0 || wayBits < 0) return { err: 'Block size, block count and ways must be powers of two.' };
    if (cfg.ways > cfg.numBlocks) return { err: 'More ways than cache blocks.' };
    const sets = cfg.numBlocks / cfg.ways, setBits = blkBits - wayBits;
    const tagBits = cfg.addrBits - setBits - wordBits - byteBits;
    if (!(cfg.addrBits >= 1 && cfg.addrBits <= 32)) return { err: 'Address must be 1 to 32 bits.' };
    if (tagBits < 0) return { err: `The cache is larger than the ${cfg.addrBits}-bit address space.` };
    return {
      addrBits: cfg.addrBits, byteAddr: !!cfg.byteAddr, bpw, byteBits, wordBits, setBits, tagBits,
      wordsPerBlock: cfg.wordsPerBlock, numBlocks: cfg.numBlocks, ways: cfg.ways, sets,
      unitsPerBlock: cfg.wordsPerBlock * bpw, memBlocks: P2(cfg.addrBits) / (cfg.wordsPerBlock * bpw),
      kind: cfg.ways === 1 ? 'direct' : sets === 1 ? 'full' : 'set'
    };
  }

  function split(g, a) {
    const block = Math.floor(a / g.unitsPerBlock);
    return {
      addr: a, block, byte: a % g.bpw, word: Math.floor(a / g.bpw) % g.wordsPerBlock,
      set: block % g.sets, tag: Math.floor(block / g.sets)
    };
  }

  function parseNum(s) {
    if (/^0x[0-9a-f_]+$/i.test(s)) return parseInt(s.slice(2).replace(/_/g, ''), 16);
    if (/^0b[01_]+$/i.test(s)) return parseInt(s.slice(2).replace(/_/g, ''), 2);
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    return null;
  }

  // unit 'addr': numbers are addresses; 'block': numbers are memory block numbers.
  function parseTrace(text, g, unit, limit) {
    limit = limit || 500;
    const acc = [], errors = [];
    const lim = P2(g.addrBits);
    text.split('\n').forEach((line, ln) => {
      const code = line.replace(/(#|\/\/).*$/, '');
      let op = null;
      for (let tok of code.split(/[\s,;]+/).filter(Boolean)) {
        const m = tok.match(/^([RWD])[:=]?(.*)$/i);
        if (m && !/^\d/.test(tok)) { op = m[1].toUpperCase(); tok = m[2]; if (!tok) continue; }
        const n = parseNum(tok);
        if (n === null) { errors.push(`line ${ln + 1}: can't read "${tok}"`); op = null; continue; }
        const a = unit === 'block' ? n * g.unitsPerBlock : n;
        if (a >= lim) errors.push(`line ${ln + 1}: ${tok} is outside the ${g.addrBits}-bit address space`);
        else if (acc.length >= limit) { if (acc.length === limit) errors.push(`only the first ${limit} accesses are used`); acc.length = limit; }
        else acc.push({ op: op || 'R', addr: a });

      }
      if (op) errors.push(`line ${ln + 1}: ${op} has no address`);

  }

  const empty = () => ({ v: 0, d: 0, tag: null, block: null, last: -1, fill: -1, next: Infinity, stale: 0 });
  const zero = () => ({ reads: 0, writes: 0, dmas: 0, hits: 0, misses: 0, compulsory: 0, capacity: 0, conflict: 0, coherence: 0, blockReads: 0, wordWrites: 0, writebacks: 0 });

  function simulate(g, acc, policy, write) {
    policy = policy || 'LRU'; write = write || 'WB';
    const f = acc.map(a => Object.assign({ op: a.op }, split(g, a.addr)));
    // next[i]: index of the next R/W access to the same block, for OPT.
    const next = new Array(f.length).fill(Infinity), seenAt = new Map();
    for (let i = f.length - 1; i >= 0; i--) {
      if (f[i].op === 'D') continue;

      seenAt.set(f[i].block, i);
    }
    const cache = Array.from({ length: g.sets }, () => Array.from({ length: g.ways }, empty));
    const snap = () => cache.map(s => s.map(l => Object.assign({}, l)));
    const seen = new Set(), dmaHit = new Set(), shadow = new Map();
    const st = zero();
    const steps = [{ idx: 0, acc: null, cache: snap(), stats: Object.assign({}, st) }];

    for (let i = 0; i < f.length; i++) {
      const a = f[i], set = cache[a.set];
      const before = set.map(l => Object.assign({}, l));
      const s = { idx: i + 1, acc: a, before, way: -1, type: null, victim: null, wroteMM: 0, writeback: false };
      if (a.op === 'D') {
        st.dmas++;

        s.way = set.findIndex(l => l.v && l.block === a.block);
        if (s.way >= 0) { const l = set[s.way]; s.discardedDirty = !!l.d; l.v = 0; l.d = 0; l.stale = 1; dmaHit.add(a.block); }
        shadow.delete(a.block);
      } else {
        a.op === 'W' ? st.writes++ : st.reads++;
        const w = set.findIndex(l => l.v && l.tag === a.tag);
        const shadowHit = shadow.has(a.block);
        if (w >= 0) {
          st.hits++; s.type = 'hit'; s.way = w;
        } else {
          st.misses++;
          s.type = dmaHit.has(a.block) ? 'coherence' : !seen.has(a.block) ? 'compulsory' : !shadowHit ? 'capacity' : 'conflict';
          st[s.type]++;
          let v = set.findIndex(l => !l.v);
          if (v < 0) {
            v = 0;
            for (let k = 1; k < set.length; k++) {
              const L = set[k], B = set[v];
              if (policy === 'FIFO' ? L.fill < B.fill : policy === 'OPT' ? L.next > B.next : L.last < B.last) v = k;
            }
            const old = set[v];
            s.victim = { block: old.block, tag: old.tag, dirty: !!old.d };
            if (write === 'WB' && old.d) { st.writebacks++; st.wordWrites += g.wordsPerBlock; s.writeback = true; }
          }
          Object.assign(set[v], { v: 1, d: 0, tag: a.tag, block: a.block, fill: i, stale: 0 });
          st.blockReads++;
          s.way = v;
          seen.add(a.block); dmaHit.delete(a.block);
        }
        const L = set[s.way];
        L.last = i; L.next = next[i];

          if (write === 'WB') L.d = 1; else { st.wordWrites++; s.wroteMM = 1; }

      s.cache = snap();
      s.stats = Object.assign({}, st);
      steps.push(s);
    }
    return { steps, stats: st };
  }

  const api = { geometry, split, parseTrace, simulate, log2 };
  if (typeof module !== 'undefined' && module) module.exports = api;
  return api;
})();
</script>

<script id="ui">

  { name: 'Replacement: Optimal', cfg: { wbits: 6, wordsPerBlock: 1, numBlocks: 4, ways: 4, policy: 'OPT' }, blocks: '1 2 3 4 1 2 5 1 2 3 4 5' },

const cfg = { byteAddr: true, addrBits: 18, wordsPerBlock: 16, numBlocks: 128, ways: 1, policy: 'LRU', write: 'WB' };

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- setup ---------- */
function fillSelects() {

// Switching byte/word addressing keeps the memory size and rewrites trace addresses.
function setAddressing(byte) {

    `memory ${geo.memBlocks} blocks · address ${geo.tagBits}/${geo.setBits}/${geo.wordBits}${geo.byteAddr ? '/2' : ''} bits`;

/* ---------- panels ---------- */
function fieldList() {

function renderLookup(s) {

function ageText(l, set) {
  if (!l.v) return '';

function renderCmp() {
  if (!cmp) return;
  if (geo.ways > 16) { $('cmp').innerHTML = `<div class="note">Columns would be ${geo.ways} lines tall. Use 16 or fewer ways to compare policies; miss counts: ${cmp.map(c => `<b>${c.p}</b> ${c.r.stats.misses}`).join(', ')}.</div>`; return; }
  const multi = geo.sets > 1;
  $('cmp').innerHTML = cmp.map(({ p, r }) => {
    const cols = r.steps.slice(1).map((s, i) => {
      const a = s.acc, set = s.cache[a.set];
      const boxes = set.map((l, w) => {
        const c = w === s.way ? (s.type === 'hit' ? ' hit' : s.type === 'dma' ? '' : ' new') : '';
        return `<span class="bx${c}">${l.v ? l.block : ''}</span>`;
      }).join('');
      const miss = s.type !== 'hit' && s.type !== 'dma';
      return `<div class="cc${i + 1 === cur ? ' cur' : i + 1 > cur ? ' fut' : ''}" data-i="${i + 1}"><span class="sq">${a.op === 'D' ? 'D' : ''}${a.block}</span>` +
        `<span class="sn">${multi ? 's' + a.set : ''}</span>${boxes}<span class="mf">${miss ? 'f' : ''}</span></div>`;
    }).join('');
    const sofar = r.steps[cur].stats.misses;
    return `<div class="cmp-row"><div class="cmp-h${p === cfg.policy ? ' sel' : ''}">${p === 'OPT' ? 'Optimal' : p}<span class="mc">${r.stats.misses} misses</span>` +
      `<span class="note">${sofar} so far</span></div><div class="strip">${cols || '<span class="note">empty trace</span>'}</div></div>`;
  }).join('') + `<div class="note">Columns show the ${multi ? 'accessed set' : 'cache'} after each access; f marks a miss. Click a column to jump.</div>`;
  document.querySelectorAll('#cmp .strip').forEach(st => {
    const c = st.querySelector('.cc.cur');
    if (c) st.scrollLeft = Math.max(0, c.offsetLeft - st.clientWidth / 2);
  });
}

function renderStats(s) {
  const t = s.stats, acc = t.hits + t.misses;
  const cell = (k, v, col) => `<div class="st"><div class="k">${k}</div><div class="v" style="color:${col || '#e5e7ff'}">${v}</div></div>`;
  $('stats').innerHTML =
    cell('Hits', t.hits, 'var(--t-hit)') + cell('Misses', t.misses, 'var(--red)') +
    cell('Hit rate', acc ? (100 * t.hits / acc).toFixed(0) + '%' : '—') +
    cell('Compulsory', t.compulsory, 'var(--t-comp)') + cell('Capacity', t.capacity, 'var(--t-cap)') +
    cell('Conflict', t.conflict, 'var(--t-conf)') + cell('Coherence', t.coherence, 'var(--t-coh)') +
    cell('MM block reads', t.blockReads) + cell('MM word writes', t.wordWrites, 'var(--amber)') +
    (cfg.write === 'WB' ? cell('Write-backs', t.writebacks) : '');
}

function renderTrace() {
  const fl = fieldList().filter(f => f.k !== 'byte');
  let h = `<tr><th>#</th><th>op</th><th>address</th>${fl.map(f => `<th>${f.n.toLowerCase()}</th>`).join('')}<th>blk</th><th>result</th></tr>`;
  const val = (a, k) => k === 'tag' ? a.tag : k === 'idx' ? a.set : a.word;
  run.steps.slice(1).forEach((s, i) => {
    const a = s.acc, n = i + 1;
    const extra = s.writeback ? ' ↩' : '';
    h += `<tr class="${n === cur ? 'cur' : n > cur ? 'fut' : ''}" data-i="${n}"><td>${n}</td><td class="op-${a.op}">${a.op}</td>` +
      `<td>${ahex(a.addr)}${geo.byteAddr && a.byte ? '<span class="ua" title="not word aligned">u</span>' : ''}</td>` +
      fl.map(f => `<td>${val(a, f.k)}</td>`).join('') + `<td>${a.block}</td>` +
      `<td class="ty ${s.type}" title="${s.victim ? 'evicted block ' + s.victim.block + (s.writeback ? ', written back' : '') : ''}">${TYPE_LABEL[s.type]}${extra}</td></tr>`;
  });
  if (run.steps.length === 1) h += '<tr><td colspan="8" class="note">No accesses. Type a trace above.</td></tr>';
  $('trace').innerHTML = h;
  const c = $('trace').querySelector('tr.cur');
  if (c) c.scrollIntoView({ block: 'nearest' });
}

function caption(s) {
  const a = s.acc;
  if (!a) return run.steps.length > 1 ? `Cache empty. ${run.steps.length - 1} accesses queued.` : 'Cache empty. Type a trace or pick an example.';
  const where = geo.kind === 'full' ? `way ${s.way}` : `${idxRef(a.set)}${geo.ways > 1 ? ', way ' + s.way : ''}`;
  if (s.type === 'dma') return s.way >= 0
    ? `DMA writes memory block <b>${a.block}</b> without the CPU. The cached copy in ${where} is now stale, so its valid bit is cleared.`
    : `DMA writes memory block <b>${a.block}</b>. It is not cached, so nothing changes.`;
  let t;
  if (s.type === 'hit') t = `<b>Hit</b>: block ${a.block} is in ${where} (V = 1, tag ${hexw(a.tag, geo.tagBits)} matches).`;
  else {
    const why = {
      compulsory: `first reference to block ${a.block}`,
      capacity: 'a fully associative LRU cache of the same size would also miss: the working set does not fit',
      conflict: `a fully associative LRU cache of the same size would hit; block ${a.block} lost its place to another block mapping to ${geo.kind === 'full' ? 'the cache' : idxRef(a.set)}`,
      coherence: `DMA invalidated block ${a.block}, so the copy in the cache could not be used`
    }[s.type];
    t = `<b>${TYPE_LABEL[s.type]} miss</b>: ${why}. Block ${a.block} is fetched into ${where}` +
      (s.victim ? `, evicting block ${s.victim.block}${geo.ways > 1 ? ` (${cfg.policy === 'OPT' ? 'used furthest in the future' : cfg.policy === 'FIFO' ? 'oldest fill' : 'least recently used'})` : ''}${s.writeback ? '; it was dirty, so it is written back first' : ''}` : '') + '.';
  }
  if (a.op === 'W') t += cfg.write === 'WB' ? ' Write-back: the line is marked dirty.' : ' Write-through: the word is written to memory too.';
  return t;
}

function render() {
  if (!run) return;
  const s = run.steps[cur], n = run.steps.length - 1;
  $('state-display').textContent = s.acc
    ? `Access ${cur}/${n} · ${s.acc.op} ${ahex(s.acc.addr)} · ${TYPE_LABEL[s.type]}`
    : (n ? 'Ready' : 'No accesses');
  $('caption').innerHTML = `<span>${caption(s)}</span>`;
  renderAddr(s); renderLookup(s); renderMmap(s); renderCache(s); renderCmp(); renderStats(s); renderTrace();
  $('slider').value = cur;
  $('step-ind').textContent = `${cur}/${n}`;
  $('b-back').disabled = $('b-reset').disabled = cur === 0;
  $('b-step').disabled = $('b-end').disabled = cur >= n;
}

/* ---------- navigation ---------- */
function go(i) { if (!run) return; cur = Math.max(0, Math.min(run.steps.length - 1, i)); render(); }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('b-play').classList.remove('on'); $('b-play').textContent = '⏵'; }
function play() {
  if (!run) return;
  if (timer) { stop(); return; }
  if (cur >= run.steps.length - 1) go(0);
  $('b-play').classList.add('on'); $('b-play').textContent = '⏸';
  timer = setInterval(() => { if (cur >= run.steps.length - 1) stop(); else go(cur + 1); }, +$('speed').value);
}

function init() {
  fillSelects();
  $('preset').innerHTML = PRESETS.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
  $('m-byte').onclick = () => setAddressing(true);
  $('m-word').onclick = () => setAddressing(false);
  $('in-ab').onchange = (e) => {
    let v = Math.round(+e.target.value);
    if (!isFinite(v)) v = cfg.addrBits;
    cfg.addrBits = Math.max(4, Math.min(32, v)); e.target.value = cfg.addrBits; build(false);
  };
  $('in-wpb').onchange = (e) => { cfg.wordsPerBlock = +e.target.value; build(false); };
  $('in-nb').onchange = (e) => {
    const full = cfg.ways === cfg.numBlocks && cfg.numBlocks > 1;
    cfg.numBlocks = +e.target.value;
    if (full) cfg.ways = cfg.numBlocks;
    syncSetup(); build(false);
  };
  $('in-ways').onchange = (e) => { cfg.ways = +e.target.value; syncSetup(); build(false); };
  $('in-pol').onchange = (e) => { cfg.policy = e.target.value; build(false); };
  $('in-wr').onchange = (e) => { cfg.write = e.target.value; build(false); };
  $('in-unit').onchange = (e) => { unit = e.target.value; build(true); };
  $('preset').onchange = (e) => applyPreset(+e.target.value);
  $('b-run').onclick = () => { stop(); build(true); };
  $('trace-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); stop(); build(true); } });
  $('b-used').onclick = () => { usedOnly = !usedOnly; usedTouched = true; $('b-used').classList.toggle('active', usedOnly); render(); };
  $('b-reset').onclick = () => { stop(); go(0); };
  $('b-back').onclick = () => { stop(); go(cur - 1); };
  $('b-step').onclick = () => { stop(); go(cur + 1); };
  $('b-end').onclick = () => { stop(); go(Infinity); };
  $('b-play').onclick = play;
  $('speed').onchange = () => { if (timer) { stop(); play(); } };
  $('slider').oninput = (e) => { stop(); go(+e.target.value); };
  $('trace').onclick = (e) => { const r = e.target.closest('tr[data-i]'); if (r) { stop(); go(+r.dataset.i); } };
  $('cmp').onclick = (e) => { const c = e.target.closest('.cc'); if (c) { stop(); go(+c.dataset.i); } };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.col').forEach(c => c.classList.toggle('show', c.id === t.dataset.col));
  });
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
    else if (e.key === 'Home' || e.key === 'r' || e.key === 'R') { stop(); go(0); }
    else if (e.key === 'End') { stop(); go(Infinity); }
  });
  applyPreset(0);
}
init();
})();
</script>
</body>
</html>

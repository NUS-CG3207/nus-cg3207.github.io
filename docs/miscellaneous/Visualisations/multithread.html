<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Multithreading</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #eef0f4; --ink: #1d2230; --dim: #667085; --line: #d4d8e0;
  --ta: #2f6fdf; --tb: #d9661a; --bad: #c8372d; --sw: #8a4fd8; --good: #1f9d6b; --accent: #2f6fdf; --onfill: #fff; --cur: #fff1c2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --panel: #1a1e27; --panel2: #232836; --ink: #e4e7ee; --dim: #97a0b3; --line: #343a4a;
    --ta: #5b8def; --tb: #e8803a; --bad: #ff7a6e; --sw: #b78bff; --good: #3fcf95; --accent: #6b9dff; --onfill: #0d1117; --cur: #4a3f16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #1a1e27; --panel2: #232836; --ink: #e4e7ee; --dim: #97a0b3; --line: #343a4a;
  --ta: #5b8def; --tb: #e8803a; --bad: #ff7a6e; --sw: #b78bff; --good: #3fcf95; --accent: #6b9dff; --onfill: #0d1117; --cur: #4a3f16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: clamp(13px, 1.05vw, 28px); }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
select, button { background: var(--panel); border: 1px solid var(--line); border-radius: 0.46rem; padding: 0.23rem 0.54rem; min-height: 2.15rem; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0.46rem 0.77rem; display: flex; flex-direction: column; gap: 0.46rem; flex: 0 0 auto; }
.bar { display: flex; flex-wrap: wrap; gap: 0.46rem 1.08rem; align-items: center; }
.grp { display: flex; align-items: center; gap: 0.38rem; white-space: nowrap; flex: 0 0 auto; }
.grp label { color: var(--dim); }
h1 { font-size: 1.15rem; margin: 0; font-weight: 650; }
#cfg { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 0.46rem 1.08rem; align-items: center; justify-content: flex-end; }
#setupBtn { display: none; }
#scrub { flex: 1 1 12rem; min-width: 9rem; accent-color: var(--accent); }
.grow { display: flex; align-items: center; gap: 0.6rem; flex: 1 1 15rem; min-width: 12rem; }
#stepNo { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 6rem; text-align: right; }
#narr { display: flex; gap: 0.6rem; align-items: baseline; min-height: 2.6rem; background: var(--panel2); border-left: 0.3rem solid var(--accent); border-radius: 0.4rem; padding: 0.35rem 0.7rem; font-size: 1.1rem; }
#narrTitle { font-weight: 650; flex: 0 0 auto; }
#narrDetail { color: var(--dim); }

main { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; font-size: 0.8rem; color: var(--dim); }
.legend .mk { display: inline-block; font-size: 0.65rem; line-height: 1; padding: 0.12rem 0.25rem; border-radius: 0.15rem; background: rgba(0, 0, 0, .42); color: #fff; margin-right: 0.25rem; }
.legend i { display: inline-block; width: 1rem; height: 1rem; border-radius: 0.2rem; vertical-align: -0.15rem; margin-right: 0.3rem; border: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; padding: 0.2rem 0.75rem 0.3rem; flex: 1 0 auto; }
.card h2 { font-size: 1.05rem; margin: 0 0 0.15rem; font-weight: 650; display: flex; gap: 0.3rem 0.8rem; align-items: baseline; flex-wrap: wrap; }
.sub { color: var(--dim); font-weight: 400; font-size: 0.88rem; }
.mstats { margin-left: auto; font-size: 0.85rem; color: var(--dim); font-weight: 400; display: flex; gap: 0.1rem 0.9rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.mstats b { color: var(--ink); font-weight: 600; }
.ok { color: var(--good); font-weight: 600; }

.gridwrap { overflow-x: auto; padding-bottom: 0.2rem; }
.tg { display: grid; gap: 0.15rem; width: max-content; min-width: 100%; grid-template-columns: repeat(var(--n), minmax(1.55rem, 1fr)); }
.tg .h { font-size: 0.66rem; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.tg .h.now { color: var(--ink); font-weight: 700; }
.tg .c { position: relative; height: clamp(0.78rem, 1.4vh, 2.1rem); border-radius: 0.22rem; border: 1px dashed var(--line); opacity: .45; font-size: 0.72rem; display: flex; align-items: center; justify-content: center; color: var(--onfill); }
.tg .c.on { opacity: 1; }
.tg .c.A { background: var(--ta); border: 1px solid var(--ta); }
.tg .c.B { background: var(--tb); border: 1px solid var(--tb); }
.tg .c.v { background: repeating-linear-gradient(135deg, var(--bad) 0 0.2rem, transparent 0.2rem 0.4rem); border: 1px solid var(--bad); }
.tg .c.h { background: transparent; border: 1px dashed var(--dim); }
.tg .c.s { background: repeating-linear-gradient(135deg, var(--sw) 0 0.2rem, transparent 0.2rem 0.4rem); border: 1px solid var(--sw); }
.tg .c.end { border-color: transparent; opacity: .2; }
.tg .c.cur { box-shadow: 0 0 0 0.14rem var(--cur); }
.tg .c.miss::after, .tg .c.dep::after { position: absolute; top: 0.04rem; right: 0.08rem; font-size: 0.55rem; font-weight: 800; line-height: 1; padding: 0.06rem 0.14rem; border-radius: 0.14rem; background: rgba(0, 0, 0, .42); color: #fff; }
.tg .c.miss::after { content: 'M'; }
.tg .c.dep::after { content: 'd'; }
.tg .c.miss { box-shadow: inset 0 0 0 0.12rem rgba(0, 0, 0, .45); }
.tg .c.miss, .tg .c.dep { justify-content: flex-start; padding-left: 0.2rem; font-size: 0.68rem; }
.tg .c .lb { background: var(--panel); color: var(--ink); font-weight: 700; padding: 0 0.2rem; border-radius: 0.14rem; line-height: 1.15; }
.tg .st { height: clamp(0.45rem, 0.78vh, 0.75rem); border-radius: 0.14rem; border: 1px dashed var(--line); opacity: .4; }
.tg .st.first { margin-top: 0.15rem; }
.tg .st.A { --tc: var(--ta); } .tg .st.B { --tc: var(--tb); }
.tg .st.on { opacity: 1; border-style: solid; border-color: var(--tc); }
.tg .st.run { background: var(--tc); }
.tg .st.miss { background: repeating-linear-gradient(135deg, var(--tc) 0 0.17rem, transparent 0.17rem 0.34rem); }
.tg .st.dep { background: radial-gradient(var(--tc) 30%, transparent 33%) 0 0 / 0.36rem 0.36rem; }
.tg .st.wait { background: transparent; }
.tg .st.on.done { border-color: transparent; background: transparent; }
.tg .st.end { border-color: transparent; opacity: .15; }

@media (max-width: 860px) {
  header { padding: 0.46rem 0.6rem; gap: 0.4rem; }
  header > .bar:first-child { gap: 0.46rem 0.77rem; }
  header > .bar:first-child > .grp:last-child { margin-left: auto; }
  #setupBtn { display: inline-block; }
  #cfg { display: none; order: 3; flex: 1 1 100%; justify-content: flex-start; }
  body.setup #cfg { display: flex; }
  #scrub { min-width: 70px; flex-basis: 70px; }
  #stepNo { min-width: 4.4rem; }
  .grow { min-width: 0; flex: 1 1 0; gap: 0.3rem; }
  #transport { gap: 0.46rem 0.6rem; flex-wrap: nowrap; }
  #transport .grp label { display: none; }
  #transport .grp:first-child button { padding: 0.23rem 0.38rem; min-width: 2.3rem; }
  #narr { min-height: 0; flex-wrap: wrap; row-gap: 0; font-size: 1rem; padding: 0.25rem 0.5rem; }
  #narrDetail { font-size: 0.92rem; }
  main { padding: 0.46rem; }
  .mstats { margin-left: 0; }
  .gridwrap { overflow-x: visible; }
  .tg { width: 100%; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0.1rem; }
  .tg .c { font-size: 0; height: 1.5rem; border-radius: 0.15rem; }
  .tg .c.miss::after, .tg .c.dep::after { display: none; }
  .tg .c.miss, .tg .c.dep { font-size: 0; padding-left: 0; }
  .tg .c .lb { display: none; }
  .tg .st { height: 0.5rem; }
  .tg .h { font-size: 0.6rem; visibility: hidden; }
  .tg .h.m5, .tg .h.now { visibility: visible; }
  .tg .h.last { justify-self: end; width: 0; direction: rtl; white-space: nowrap; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="grp"><h1>Hardware multithreading</h1></div>
    <div id="cfg">
      <div class="grp"><label for="selW">Issue width</label><select id="selW" title="Instructions the core can issue per cycle"></select></div>
      <div class="grp"><label for="selIlp">Thread ILP</label><select id="selIlp" title="Most independent instructions a thread can offer in one cycle"></select></div>
      <div class="grp"><label for="selStall">Stalls</label><select id="selStall" title="How often a thread waits: a one-cycle dependency or a cache miss"><option value="low">few</option><option value="medium">some</option><option value="high">many</option></select></div>
      <div class="grp"><label for="selLat">Miss latency</label><select id="selLat" title="Cycles a thread waits after a cache miss"></select></div>
      <div class="grp"><label for="selSw">Switch cost</label><select id="selSw" title="Pipeline refill cycles each time coarse-grained multithreading switches thread"></select></div>
      <div class="grp"><button id="bShuf" title="New instruction streams">Reshuffle</button></div>
    </div>
    <div class="grp"><button id="setupBtn" title="Show or hide the settings">Setup</button></div>
  </div>
  <div class="bar" id="transport">
    <div class="grp">
      <button id="bReset" title="Back to the start (Home)">⏮</button>
      <button id="bBack" title="Previous cycle (←)">◀</button>
      <button id="bPlay" title="Play / pause (Space)" style="min-width:3.4rem">▶</button>
      <button id="bStep" title="Next cycle (→)">▶|</button>
    </div>
    <div class="grow"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Cycle"><span id="stepNo"></span></div>
    <div class="grp"><label for="selSpeed">Speed</label><select id="selSpeed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
    </select></div>
  </div>
  <div id="narr"><span id="narrTitle"></span><span id="narrDetail"></span></div>
</header>
<main id="main"></main>

<script src="multithread_engine.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const pct = v => Math.round(v * 100) + '%';
const range = n => Array.from({ length: n }, (_, i) => i);
const STATE_TEXT = { run: 'issues', miss: 'is waiting on a cache miss', dep: 'is waiting on a dependency', wait: 'is ready but not picked', done: 'has finished' };
const CARDS = [
  ['none', 'No multithreading', 'one thread at a time; the core idles through every stall'],
  ['cgmt', 'Coarse-grained', 'switch thread on a cache miss, paying a pipeline refill'],
  ['barrel', 'Fine-grained: barrel', 'strict alternation; a stalled thread\'s turn is wasted even if the other is ready'],
  ['fgmt', 'Fine-grained: skipping', 'a different ready thread every cycle; a stalled thread is skipped'],
  ['smt', 'Simultaneous (SMT)', 'both threads can fill the issue slots of one cycle'],
];

const app = { k: 0, model: null, seed: 5, playing: false, timer: null, speed: 1, go: k => goTo(k) };
window.app = app;

function fill(id, vals, def, fmt) {
  $(id).innerHTML = vals.map(v => `<option value="${v}"${v === def ? ' selected' : ''}>${fmt ? fmt(v) : v}</option>`).join('');
}

function view(m, k) {
  const N = m.maxCycles, W = m.width;
  let html = `<div class="legend"><span><i style="background:var(--ta)"></i>thread A</span><span><i style="background:var(--tb)"></i>thread B</span><span><i style="background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);border-color:var(--bad)"></i>cycle lost</span><span><i style="border:1px dashed var(--dim)"></i>slot unused</span><span><i style="background:repeating-linear-gradient(135deg,var(--sw) 0 3px,transparent 3px 6px);border-color:var(--sw)"></i>pipeline refill</span><span><b class="mk">M</b> load misses</span><span><b class="mk">d</b> dependency</span><span>thread strips: <i style="background:repeating-linear-gradient(135deg,var(--dim) 0 2px,transparent 2px 4px);border-color:var(--dim)"></i>miss <i style="background:radial-gradient(var(--dim) 30%,transparent 33%) 0 0/5px 5px;border-color:var(--dim)"></i>dependency <i style="background:transparent;border-color:var(--dim)"></i>ready, not picked; solid = issuing</span></div>`;
  for (const [id, title, sub] of CARDS) {
    const r = m.modes[id], t = Math.min(k, r.length), done = k >= r.length;
    let issued = 0;
    for (let c = 0; c < t; c++) issued += r.cycles[c].filter(x => x.th !== undefined).length;
    let g = range(N).map(c => `<div class="h${(c + 1) % 5 === 0 ? ' m5' : ''}${c === N - 1 ? ' last' : ''}${c === k - 1 ? ' now' : ''}">${c + 1}</div>`).join('');
    for (let s = 0; s < W; s++) {
      for (let c = 0; c < N; c++) {
        let cls = 'c', txt = '', tip = '';
        if (c >= r.length) cls += ' end';
        else if (c < t) {
          const x = r.cycles[c][s];
          cls += ' on ' + (x.th !== undefined ? (x.th ? 'B' : 'A') : x.kind === 'vwaste' ? 'v' : x.kind === 'switch' ? 's' : 'h');
          if (x.th !== undefined) {
            const T = x.th ? 'B' : 'A';
            txt = T + x.id;
            if (x.stall) cls += ' ' + x.stall;
            tip = `${T}${x.id}` + (x.stall === 'miss' ? `: a load that misses in the cache, so thread ${T} stalls for ${m.lat} cycles` : x.stall === 'dep' ? `: the next instructions depend on it, so thread ${T} stalls for 1 cycle` : '');
          } else if (x.kind === 'vwaste') {
            tip = 'No thread can issue this cycle: ' + r.states[c].map((st, i) => `${i ? 'B' : 'A'} ${STATE_TEXT[st]}`).join(', ');
          } else if (x.kind === 'switch') {
            const a = x.from ? 'B' : 'A', b = x.to ? 'B' : 'A';
            tip = `Pipeline refill: coarse-grained switch from thread ${a} (stalled on a miss) to thread ${b}`;
            if (s === 0) txt = `<span class="lb">→${b}</span>`;
          } else tip = 'Unused slot: the issuing thread has no more independent instructions this cycle';
        }
        if (c === k - 1 && c < r.length) cls += ' cur';
        g += `<div class="${cls}" data-c="${c}" data-s="${s}"${tip ? ` title="${tip}"` : ''}>${txt}</div>`;
      }
    }
    for (let th = 0; th < 2; th++) {
      for (let c = 0; c < N; c++) {
        const state = c < Math.min(t, r.length) ? r.states[c][th] : null;
        const cls = `st ${th ? 'B' : 'A'}${th === 0 ? ' first' : ''}${c >= r.length ? ' end' : state ? ' on ' + state : ''}`;
        g += `<div class="${cls}" data-c="${c}" data-th="${th}"${state ? ` title="Thread ${th ? 'B' : 'A'} ${STATE_TEXT[state]}"` : ''}></div>`;
      }
    }
    const lost = done ? `<span>lost slots: <b>${r.vwaste}</b> in empty cycles, <b>${r.hwaste}</b> in partial cycles${r.switchSlots ? `, <b>${r.switchSlots}</b> in refills` : ''}</span>` : '';
    html += `<div class="card" data-mode="${id}"><h2>${title}<span class="sub">${sub}</span>
      <span class="mstats"><span>cycle <b>${t}</b> / ${r.length}${done ? ' <span class="ok">✓</span>' : ''}</span><span>IPC <b>${t ? (issued / t).toFixed(2) : '–'}</b></span><span>slots used <b>${t ? pct(issued / (t * W)) : '–'}</b></span><span>A done <b>${r.finishedAt[0] <= k ? r.finishedAt[0] : '–'}</b></span><span>B done <b>${r.finishedAt[1] <= k ? r.finishedAt[1] : '–'}</b></span>${id === 'cgmt' ? `<span>switches <b>${r.switches}</b></span>` : ''}${lost}</span></h2>
      <div class="gridwrap"><div class="tg" style="--n:${N}">${g}</div></div></div>`;
  }
  const L = m.modes;
  let title, detail;
  if (k === 0) {
    title = 'Two threads, one core';
    detail = `Columns are cycles, rows are the ${W} issue slots. The same two instruction streams run under each scheme.`;
  } else if (k >= N) {
    title = 'Done';
    detail = `Cycles for both threads: none ${L.none.length}, coarse ${L.cgmt.length}, barrel ${L.barrel.length}, fine ${L.fgmt.length}, SMT ${L.smt.length}.`;
  } else {
    title = `Cycle ${k}`;
    const used = id => { let u = 0; const r = L[id]; for (let c = 0; c < Math.min(k, r.length); c++) u += r.cycles[c].filter(x => x.th !== undefined).length; return pct(u / (W * Math.min(k, r.length))); };
    detail = `Slots used so far: none ${used('none')}, coarse ${used('cgmt')}, barrel ${used('barrel')}, fine ${used('fgmt')}, SMT ${used('smt')}.`;
  }
  return { html, title, detail };
}

function render() {
  const m = app.model, v = view(m, app.k);
  const keep = $('main').scrollTop;
  $('main').innerHTML = v.html;
  $('main').scrollTop = keep;
  const wraps = [...document.querySelectorAll('.gridwrap')];
  if (wraps.length) {
    const w = wraps[0], x = Math.max(0, (app.k / Math.max(1, m.maxCycles)) * w.scrollWidth - w.clientWidth * 0.7);
    wraps.forEach(e => { e.scrollLeft = x; });
  }
  $('narrTitle').textContent = v.title;
  $('narrDetail').textContent = v.detail;
  $('scrub').value = app.k;
  $('stepNo').textContent = `${app.k} / ${m.maxCycles}`;
  $('bBack').disabled = $('bReset').disabled = app.k === 0;
  $('bStep').disabled = app.k >= m.maxCycles;
  $('bPlay').textContent = app.playing ? '⏸' : '▶';
}

function rebuild(resetK) {
  app.model = MT.run({ width: +$('selW').value, ilp: +$('selIlp').value, stalls: $('selStall').value, lat: +$('selLat').value, switchCost: +$('selSw').value, seed: app.seed });
  if (resetK) app.k = 0;
  app.k = Math.min(app.k, app.model.maxCycles);
  $('scrub').max = app.model.maxCycles;
  stopPlay();
  render();
}
function goTo(k) { app.k = Math.max(0, Math.min(app.model.maxCycles, k)); render(); }
function stopPlay() { app.playing = false; clearInterval(app.timer); app.timer = null; }
function startPlay() {
  if (app.k >= app.model.maxCycles) app.k = 0;
  app.playing = true;
  clearInterval(app.timer);
  app.timer = setInterval(() => { if (app.k >= app.model.maxCycles) { stopPlay(); render(); } else goTo(app.k + 1); }, 500 / app.speed);
  render();
}
const togglePlay = () => (app.playing ? (stopPlay(), render()) : startPlay());

fill('selW', [2, 4], 4);
fill('selIlp', [1, 2, 3, 4], 3);
fill('selLat', [4, 6, 8, 12], 6);
fill('selSw', [0, 1, 2, 3], 2);
for (const id of ['selW', 'selIlp', 'selStall', 'selLat', 'selSw']) $(id).addEventListener('change', () => rebuild(true));
$('bShuf').addEventListener('click', () => { app.seed++; rebuild(true); });
$('bPlay').addEventListener('click', togglePlay);
$('bStep').addEventListener('click', () => { stopPlay(); goTo(app.k + 1); });
$('bBack').addEventListener('click', () => { stopPlay(); goTo(app.k - 1); });
$('bReset').addEventListener('click', () => { stopPlay(); goTo(0); });
$('scrub').addEventListener('input', e => { stopPlay(); goTo(+e.target.value); });
$('selSpeed').addEventListener('change', e => { app.speed = +e.target.value; if (app.playing) startPlay(); });
$('setupBtn').addEventListener('click', () => document.body.classList.toggle('setup'));
document.addEventListener('keydown', e => {
  if (e.target.matches('select, input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { stopPlay(); goTo(app.k + 1); }
  else if (e.key === 'ArrowLeft') { stopPlay(); goTo(app.k - 1); }
  else if (e.key === 'Home') { stopPlay(); goTo(0); }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
rebuild(true);
</script>
</body>
</html>

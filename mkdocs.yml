site_name: NUS CG3207 Labs
site_url: https://nus-cg3207.github.io
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: nus
  font:
    text: Merriweather
  icon:
    annotation: material/information-variant-circle-outline
  features:
    - content.tooltips
    - navigation.indexes
    
extra_css:
  - stylesheets/extra.css
  - stylesheets/isa-tutorial.css
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.blocks.caption
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      toc_depth: 3
  # - glightbox

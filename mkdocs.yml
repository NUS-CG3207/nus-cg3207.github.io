extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nus-cg3207

    - icon: fontawesome/solid/envelope
      link: mailto:neil@nus.edu.sg

nav:
  - Home: index.md
  - Getting Started:
    - How to use this website: getting_started/howto.md
    - Lab Prerequisites: getting_started/prereq.md
    - Getting to know your Nexys 4: getting_started/nexys4.md
    - Installation Guide for Vivado: getting_started/vivado_install_guide.md
  - Assignment manuals:
    - Assignment 1 [Weeks 4-5]: asst_manuals/Asst_01/Asst_01.md
    - Assignment 2 [Weeks 5-7]: asst_manuals/Asst_02/Asst_02.md
    - Assignment 3 [Weeks 7-9]: asst_manuals/Asst_03/Asst_03.md
    - Assignment 4 [Weeks 9-12]: asst_manuals/Asst_04/Asst_04.md
  - Resources for RISC-V:
    - Memory Map: rv_resources/rv_memmap.md
    - Peripheral Guides: rv_resources/peripherals.md
    - Programming Guide: rv_resources/rv_programming.md
    - RISC-V Simulator: rv_resources/web_sim/riscv_simulator.md
    - RISC-V ISA Tutorial:
      - Getting Started: rv_resources/isa_tutorial/getting-started.md
      - Background: rv_resources/isa_tutorial/background.md
      - Registers: rv_resources/isa_tutorial/registers.md
      - Instruction Formats: rv_resources/isa_tutorial/formats.md
      - Data Processing Instructions: rv_resources/isa_tutorial/dp-instructions.md
      - Memory Instructions: rv_resources/isa_tutorial/memory-instructions.md
      - Control Instructions: rv_resources/isa_tutorial/control-instructions.md
      - RISC-V Assembly Examples: rv_resources/isa_tutorial/assembly.md
      - ISA Designer's Dilemma: rv_resources/isa_tutorial/isa-design.md
  - Miscellaneous:
    - Prefetching: misc/Prefetching.md

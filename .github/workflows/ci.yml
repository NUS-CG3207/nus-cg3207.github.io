name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt ghp-import
      - run: zensical build --clean --strict
      # Zensical has no gh-deploy, so push the built site to the gh-pages
      # branch ourselves (the branch GitHub Pages already serves from).
      - run: ghp-import --no-jekyll --push --force --message "Deployed ${GITHUB_SHA::7} with Zensical" site
